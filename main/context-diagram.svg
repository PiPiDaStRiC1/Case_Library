<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 28px Arial;fill:#0f172a}.subtitle{font:400 15px Arial;fill:#475569}
      .label{font:700 16px Arial;fill:#0f172a}.text{font:400 14px Arial;fill:#334155}
      .person{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.system{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}
      .external{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.boundary{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:8 7}
      .rel{stroke:#334155;stroke-width:1.7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="70" y="55" class="title">LibraFlow — C4 Context Diagram</text>
  <text x="70" y="82" class="subtitle">Кейс №8 «Библиотека» · версия 1.0 · 19.10.2026</text>
  <rect x="360" y="140" width="680" height="650" rx="18" class="boundary"/>
  <text x="385" y="172" class="subtitle">Граница системы</text>
  <rect x="560" y="400" width="280" height="130" rx="12" class="system"/>
  <text x="610" y="445" class="label">LibraFlow</text>
  <text x="594" y="475" class="text">Платформа библиотеки</text>
  <text x="585" y="499" class="text">каталог · бронь · выдача</text>
  <rect x="70" y="180" width="220" height="100" rx="12" class="person"/>
  <text x="137" y="220" class="label">Читатель</text><text x="100" y="248" class="text">Ищет и бронирует книги</text>
  <rect x="70" y="390" width="220" height="100" rx="12" class="person"/>
  <text x="125" y="430" class="label">Библиотекарь</text><text x="94" y="458" class="text">Выдаёт и принимает книги</text>
  <rect x="70" y="600" width="220" height="100" rx="12" class="person"/>
  <text x="115" y="640" class="label">Администратор</text><text x="91" y="668" class="text">Настраивает фонд и правила</text>
  <rect x="1110" y="160" width="220" height="100" rx="12" class="person"/>
  <text x="1168" y="200" class="label">Руководитель</text><text x="1150" y="228" class="text">Смотрит отчёты и KPI</text>
  <rect x="1110" y="330" width="220" height="100" rx="12" class="external"/>
  <text x="1170" y="370" class="label">API карт</text><text x="1140" y="398" class="text">Адреса и координаты филиалов</text>
  <rect x="1110" y="500" width="220" height="100" rx="12" class="external"/>
  <text x="1166" y="540" class="label">Email / SMS</text><text x="1145" y="568" class="text">Доставка уведомлений</text>
  <rect x="1110" y="670" width="220" height="100" rx="12" class="external"/>
  <text x="1150" y="710" class="label">Корпоративный IdP</text><text x="1142" y="738" class="text">Вход сотрудников</text>
  <path d="M290 230 L560 430" class="rel"/><text x="344" y="300" class="text">поиск, бронь</text>
  <path d="M290 440 L560 465" class="rel"/><text x="345" y="425" class="text">выдача, возврат</text>
  <path d="M290 650 L560 500" class="rel"/><text x="345" y="620" class="text">фонд, правила</text>
  <path d="M840 445 L1110 210" class="rel"/><text x="900" y="300" class="text">отчёты</text>
  <path d="M840 430 L1110 380" class="rel"/><text x="900" y="390" class="text">адреса / координаты</text>
  <path d="M840 485 L1110 550" class="rel"/><text x="900" y="540" class="text">уведомления</text>
  <path d="M840 510 L1110 710" class="rel"/><text x="910" y="665" class="text">аутентификация</text>
  <text x="70" y="850" class="subtitle">Синие — люди и роли · зелёный — продукт · оранжевые — внешние системы</text>
</svg>
